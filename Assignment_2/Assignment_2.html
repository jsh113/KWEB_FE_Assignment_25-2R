<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="Assignment_2.css">

</head>
<body>
  <header class="topbar">KWEB 설문</header>

  <form action="#" method="post">

    <p>1. 이름을 작성해주세요.</p>
    <input type="text" name="name"><br><br>

    <p>2. 학번을 작성해주세요.</p>
    <input type="text" name="studentId"><br><br>

    <p>3. 현재 회원 등급을 선택해주세요.</p>
    <label><input type="radio" name="grade" value="준회원"> 준회원</label>
    <label><input type="radio" name="grade" value="정회원"> 정회원</label>
    <label><input type="radio" name="grade" value="휴회원"> 휴회원</label>
    <br><br>

    <p>4. 본인이 관심있는 분야를 모두 선택해주세요.</p>
    <label><input type="checkbox" name="interest_front"> 프론트엔드 프로그래밍</label>
    <label><input type="checkbox" name="interest_back"> 백엔드 프로그래밍</label>
    <label><input type="checkbox" name="interest_crawl"> 웹 크롤링</label>
    <label><input type="checkbox" name="interest_security"> 웹 보안</label>
    <label>
      <input type="checkbox" name="interest_etc"> 기타
      <input type="text" name="interest_etc_text">
    </label>
    <br><br>

    <p>5. 2020년 봄학기 KWEB 스터디에 대한 전반적인 평가와 피드백을 작성해주세요.</p>
    <textarea name="feedback" rows="10" cols="80"></textarea><br><br>

    <input type="submit" value="제출">
  </form>
  <button type="button" class="bottom">우측 하단 버튼</button>
</body>
</html>
